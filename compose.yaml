services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: itjobs_docker
      MYSQL_USER: itjobs_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: vnitjobs-backend:dev
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/itjobs_docker
      DB_USERNAME: itjobs_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
  frontend:
    build:
      context: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
volumes:
  mysql_data:
  uploads_data: